sonar.projectKey=oviedoarnold_Sistema-Ferreteria
sonar.organization=oviedoarnold

sonar.projectName=Sistema Ferreteria
sonar.projectVersion=1.0

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.jsx,**/*.test.js
# src/test/ son dobles y ayudantes de prueba, no codigo que se despliega.
# El doble de Supabase tiene que ser thenable porque el constructor de
# consultas de supabase-js lo es, y sin eso no reproduce a la libreria; Sonar
# lo marca como fallo con razon para codigo de produccion, pero aqui es lo
# que se quiere. Se excluyen por lo mismo que ya se excluian los *.test.*
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.jsx,**/*.test.js,src/test/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.sourceEncoding=UTF-8

# Mismas exclusiones que vite.config.js, por la misma razon: las plantillas
# de impresion son marcado que se valida mirando el PDF, y documentUtils
# genera el archivo con jsPDF, que jsdom no puede verificar.
sonar.coverage.exclusions=**/InvoiceTemplate.jsx,**/QuoteTemplate.jsx,**/documentUtils.js,**/main.jsx,**/registrarServiceWorker.js,src/prerender/**
