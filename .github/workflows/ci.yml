name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Las acciones se fijan por SHA de commit y no por etiqueta: una etiqueta
# puede reapuntarse a otro código sin que nos enteremos.
jobs:
  verificar:
    name: Lint, tests y build
    runs-on: ubuntu-latest

    permissions:
      contents: read


    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # SonarCloud necesita el historial para atribuir el código nuevo.
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      # --ignore-scripts evita que un paquete ejecute código al instalarse.
      # Los únicos que los usan aquí son core-js, que solo imprime un
      # mensaje, y fsevents, que es exclusivo de macOS. Los binarios de
      # rolldown llegan como paquetes por plataforma, no por script.
      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      # Los tres pasos siguientes bloquean: si el lint marca algo, un test
      # falla o el build se rompe, el pipeline queda en rojo y el commit no
      # se considera bueno.
      - name: Lint
        run: npm run lint

      - name: Tests con cobertura
        run: npm run coverage:ci

      # Sin esto, saber que prueba fallo exige permisos de administrador
      # para descargar los logs. Con esto queda escrito en la pagina del
      # run, que cualquiera con acceso al repositorio puede leer.
      - name: Anotar las pruebas que fallaron
        if: failure()
        run: node scripts/resumir-fallos.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Build de producción
        run: npm run build

      # El analisis de SonarCloud no corre aqui: el proyecto usa Automatic
      # Analysis, que se dispara del lado de SonarCloud y publica el check
      # "SonarCloud Code Analysis". Aqui vivia un step del scanner con
      # if: env.SONAR_TOKEN != '' que nunca se cumplia porque el secreto no
      # existe; se retira para que el workflow diga lo que de verdad hace.
      # Consecuencia conocida: SonarCloud no recibe cobertura, porque eso
      # solo lo sube el scanner. Queda anotado en requisitos-pendientes.

      - name: Publicar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura
          path: coverage/
          retention-days: 30

  # ─────────────────────────────────────────────────────────
  # Las pruebas contra PostgreSQL de verdad.
  #
  # Van en su propio job y no como un paso del anterior por dos razones:
  # corren en paralelo, así que no retrasan el lint ni el build, y publican
  # su propio check. Que se vea aparte importa, porque lo que vigilan —que
  # una migración siga aplicándose, que un CHECK siga rechazando, que RLS
  # siga aislando, que el reparto siga siendo FIFO y que dos cobros
  # simultáneos no gasten el mismo saldo— no es lo mismo que una prueba de
  # interfaz en jsdom, y confundir los dos fallos costaría tiempo.
  #
  # No lleva secretos ni variables de entorno. No puede apuntar a Supabase:
  # el arnés construye su conexión él mismo contra una base desechable en
  # el temporal del runner, y pruebas-sql/guardia.mjs lo comprueba en cada
  # arranque. La versión de PostgreSQL la fija package-lock.json.
  # ─────────────────────────────────────────────────────────
  pruebas-sql:
    name: Pruebas SQL contra PostgreSQL real
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Descargar el código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Preparar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --ignore-scripts

      # --ignore-scripts, que es lo correcto para todo lo demás, deja sin
      # correr el postinstall del paquete de binarios de PostgreSQL. Ese
      # postinstall rehace los enlaces simbólicos de lib/, sin los cuales el
      # servidor no arranca en Linux. Se rehace solo ese paquete, de forma
      # explícita, en vez de levantar la restricción para todos.
      - name: Preparar el binario de PostgreSQL
        run: npm rebuild @embedded-postgres/linux-x64

      # Bloquea: si el reparto deja de ser FIFO, si el sobrepago deja de
      # rechazarse o si dos cobros simultáneos dejan de serializarse, el
      # pipeline queda en rojo.
      - name: Pruebas SQL
        run: npm run test:sql
