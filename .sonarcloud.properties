# Configuración que lee el análisis automático de SonarCloud. Ese análisis ignora
# sonar-project.properties, que solo usaría un scanner en CI.
#
# Saca dos migraciones ya aplicadas solo del cálculo de duplicación. Para cambiar una
# función en SQL hay que reescribirla completa, y esos archivos no se pueden editar
# sin cambiar su MD5 registrado en producción. Siguen analizados por las demás reglas,
# también las de seguridad.
#
# Van por ruta exacta: no se admiten comodines y el resto del SQL sigue contando.
sonar.cpd.exclusions=supabase/migrations/0041_cargo_e_isv_por_venta.sql,supabase/migrations/0042_precios_por_cliente.sql
